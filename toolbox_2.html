    <script>
      //only 14 words allowed
      const editorInput = document.getElementById('text-editor');

      if (editorInput) {
        editorInput.addEventListener('input', function() {
          const rawValue = this.value;
          const words = rawValue.replace(/\n/g, ' ').trim().split(/\s+/).filter(Boolean);

          if (words.length > 14) {
              const line1 = words.slice(0, 6).join(' ');
              const line2 = words.slice(6, 14).join(' ');
              this.value = line1 + '\n' + line2;
              return; // Stop here
          }

          if (words.length > 6 && !rawValue.includes('\n')) {
              const line1 = words.slice(0, 6).join(' ');
              const line2 = words.slice(6).join(' ');
              this.value = line1 + '\n' + line2;
          }
        });
      }
